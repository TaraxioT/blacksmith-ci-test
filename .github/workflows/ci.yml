name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hello:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Runner info
        run: |
          echo "Running on Blacksmith"
          uname -a
          nproc
          free -h
      - uses: useblacksmith/setup-node@v5
        with:
          node-version: 22
      - run: node --version
